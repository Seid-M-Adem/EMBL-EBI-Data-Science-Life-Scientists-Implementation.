[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dsls"
version = "0.1.0"
description = "Reusable code for my implementations of the EMBL-EBI 'Data science for life scientists' course"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Everything src/dsls imports at runtime (CI installs only these plus pytest, so a missing entry fails CI)
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dl = ["torch>=2.2"]  # dsls.textclf (deep-learning modules)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: calls live EMBL-EBI APIs (deselect with -m 'not network')"]
addopts = "-m 'not network'"
