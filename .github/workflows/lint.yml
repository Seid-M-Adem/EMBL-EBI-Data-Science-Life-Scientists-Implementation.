name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install ruff
      - name: Lint Python files and notebooks
        # Settings (notebooks included, course_materials/ excluded) live in ruff.toml
        run: ruff check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install my package and test tools
        # CPU-only PyTorch wheel (~200 MB instead of ~2 GB with CUDA) for dsls.textclf
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dl]" -r requirements-dev.txt
      - name: Run unit tests (offline)
        run: pytest -q
